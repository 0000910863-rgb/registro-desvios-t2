<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro de Desvios T2</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f4f8;font:16px Arial;color:#17274b}header{background:#ffe600;padding:24px;font-size:23px;font-weight:bold}main{max-width:1050px;margin:auto;padding:20px}section{background:white;padding:22px;border-radius:12px;margin-bottom:18px;box-shadow:0 2px 8px #0001}label{display:block;margin:12px 0 5px}input,textarea{width:100%;padding:12px;border:1px solid #bcc6d6;border-radius:6px;font:inherit}button{background:#2459b8;color:white;border:0;border-radius:6px;padding:12px;margin:8px 5px 0 0;cursor:pointer}button:disabled{opacity:.5}article{border-top:1px solid #ddd;padding:15px 0;white-space:pre-wrap;overflow-wrap:anywhere}small{color:#526078} [hidden]{display:none!important}#msg{white-space:pre-wrap;color:#9b3420}img{max-width:100%;max-height:500px}</style><header>Registro de Desvios de Segurança | T2</header><main><p id="msg" role="status"></p><div id="app"><section><h2>Novo registro</h2><form id="rf"><label>Nome do colaborador</label><input id="nome" required><label>Local do ocorrido</label><input id="local" required><label>Descrição do ocorrido</label><textarea id="descricao" required rows="4"></textarea><label>Registrado por</label><input id="autor" required><label>Foto (opcional)</label><input id="foto" type="file" accept="image/jpeg,image/png,image/webp"><small>Data e horário registrados automaticamente.</small><br><button id="salvar">Salvar registro</button><button type="button" id="cancelar" hidden>Cancelar edição</button></form></section><section><h2>Histórico</h2><input id="filtro" placeholder="Filtrar pelo nome do colaborador"><button id="exportar">Exportar Excel (CSV)</button><button id="atualizar">Atualizar</button><p id="total"></p><div id="lista"></div></section></div></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://fhimktkluuvsqqvyabha.supabase.co','sb_publishable_1uqAfQBIT8gdZNaiwAS3Jg_3iZnEKe3',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const $=id=>document.getElementById(id);let rows=[],editing=null;const msg=t=>$('msg').textContent=t;const check=r=>{if(r.error)throw r.error;return r.data};const run=fn=>async e=>{e?.preventDefault();try{msg('');await fn(e)}catch(err){msg(err.message||String(err))}};
async function load(){let all=[],i=0;while(true){let a=check(await db.from('registro_desvios').select('*').order('criado_em',{ascending:false}).order('id').range(i,i+499));all.push(...a);if(a.length<500)break;i+=500}rows=all;render()}
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const filtered=()=>rows.filter(r=>norm(r.nome).includes(norm($('filtro').value)));const date=s=>new Date(s).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'});
function render(){let list=$('lista');list.replaceChildren();$('total').textContent=filtered().length+' registro(s)';for(const r of filtered()){let a=document.createElement('article');let t=document.createElement('strong');t.textContent=r.nome;a.append(t,document.createTextNode('\n'+date(r.criado_em)+' | '+r.local+'\n'+r.descricao+'\nRegistrado por: '+(r.registrado_por||'')+'\n'));function btn(label,fn){let b=document.createElement('button');b.textContent=label;b.onclick=run(fn);a.append(b)}if(r.foto)btn('Ver foto',async()=>{let data=check(await db.storage.from('fotos-desvios').createSignedUrl(r.foto,60));let im=document.createElement('img');im.src=data.signedUrl;a.append(document.createElement('br'),im)});btn('Editar',()=>{editing=r;$('nome').value=r.nome;$('local').value=r.local;$('descricao').value=r.descricao;$('autor').value=r.registrado_por||'';$('cancelar').hidden=false;window.scrollTo(0,0)});btn('Excluir',async()=>{if(!confirm('Excluir este registro?'))return;check(await db.from('registro_desvios').delete().eq('id',r.id));if(r.foto)check(await db.storage.from('fotos-desvios').remove([r.foto]));await load()});list.append(a)}}
function reset(){editing=null;$('rf').reset();$('cancelar').hidden=true} $('cancelar').onclick=reset;$('filtro').oninput=render;$('atualizar').onclick=run(load);
async function start(){await load()}
$('rf').onsubmit=run(async()=>{let b=$('salvar');b.disabled=true;let uploaded=null;try{let r={nome:$('nome').value.trim(),local:$('local').value.trim(),descricao:$('descricao').value.trim(),registrado_por:$('autor').value.trim()};if(Object.values(r).some(v=>!v))throw Error('Preencha todos os campos.');let f=$('foto').files[0];if(f){if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5*1024*1024)throw Error('Use JPG, PNG ou WEBP de até 5 MB.');uploaded='registros/'+crypto.randomUUID();check(await db.storage.from('fotos-desvios').upload(uploaded,f));r.foto=uploaded}let old=editing?.foto;try{check(await (editing?db.from('registro_desvios').update(r).eq('id',editing.id):db.from('registro_desvios').insert(r)))}catch(e){if(uploaded)await db.storage.from('fotos-desvios').remove([uploaded]);throw e}reset();if(old&&uploaded)await db.storage.from('fotos-desvios').remove([old]);await load();msg('Registro salvo.')}finally{b.disabled=false}});
$('exportar').onclick=()=>{let esc=v=>'"'+String(v??'').replace(/^[\s]*[=+@\-]/,"'$&").replaceAll('"','""')+'"';let csv=[['Nome','Local','Descrição','Registrado por','Data e horário','Foto'],...filtered().map(r=>[r.nome,r.local,r.descricao,r.registrado_por,date(r.criado_em),r.foto?'Sim':'Não'])].map(r=>r.map(esc).join(';')).join('\r\n');let u=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='registros-desvios.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};run(start)();
</script></html>
